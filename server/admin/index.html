<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Заявки АРКА 123: админка</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23203641'/%3E%3Cpath d='M16 52V30a16 16 0 0 1 32 0v22' fill='none' stroke='%23f4efe8' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main id="app">
    <section class="login" id="login" hidden>
      <form id="login-form" class="panel">
        <h1>Админка АРКА 123</h1>
        <p class="muted">Заявки на бронирование зала.</p>
        <label>Пароль<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="btn btn--primary" type="submit">Войти</button>
        <p class="msg" id="login-msg" role="alert"></p>
      </form>
    </section>

    <section id="panel" hidden>
      <header class="bar">
        <div>
          <h1>Заявки АРКА 123</h1>
          <p class="muted" id="summary" aria-live="polite"></p>
        </div>
        <div class="bar-actions">
          <a class="link" href="../">К сайту</a>
          <button class="btn" id="logout" type="button">Выйти</button>
        </div>
      </header>
      <nav class="tabs" id="tabs" aria-label="Фильтр по статусу"></nav>
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>Заявок в этом разделе пока нет.</p>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
